name: Build and test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (leave empty to only build and test)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  mac:
    name: macOS (Apple Silicon and Intel)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Build app (.dmg and .zip, arm64 and x64)
        run: |
          node scripts/make-icons.mjs
          npx vite build
          npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Install BasicTeX (TeX Live for Mac) for the tests
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self

      - name: Compile templates (missing packages installed through the app)
        env:
          FREEDOMTEX_SUDO: '1'
        run: node scripts/test-templates.mjs blank example thesis ieee-conference beamer

      - name: UI smoke test on the packaged app
        env:
          SMOKE_EXE: release/mac-arm64/FreedomTex.app/Contents/MacOS/FreedomTex
        run: node scripts/smoke.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-screenshots
          path: scripts/.smoke/*.png
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: freedomtex-mac
          path: |
            release/*.dmg
            release/*.zip

      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" release/*.dmg release/*.zip --clobber

  windows:
    name: Windows (clean machine, first-run MiKTeX install)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Cache the MiKTeX installer
        uses: actions/cache@v4
        with:
          path: resources/miktex
          key: miktex-basic-25.12-x64

      - name: Build installer
        shell: bash
        run: |
          node scripts/make-icons.mjs
          node scripts/fetch-miktex.mjs
          npx vite build
          npx electron-builder --win nsis --x64 --publish never
          # The installer must contain MiKTeX; stop here if it does not.
          ls release/win-unpacked/resources/miktex/basic-miktex-*.exe

      - name: First run on a PC without LaTeX (installs the bundled MiKTeX)
        env:
          SMOKE_EXE: release\win-unpacked\FreedomTex.exe
        run: node scripts/test-firstrun.mjs

      - name: Compile templates with the fresh MiKTeX
        run: node scripts/test-templates.mjs blank example thesis ieee-conference

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: scripts/.smoke/**/*.png
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: freedomtex-windows
          path: release/FreedomTex-Setup-*.exe

      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" release/FreedomTex-Setup-*.exe --clobber

  windows-arm:
    name: Windows on ARM (clean machine, first-run MiKTeX install)
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          node node_modules/electron/install.js

      - name: Cache the MiKTeX installer
        uses: actions/cache@v4
        with:
          path: resources/miktex
          key: miktex-basic-25.12-x64

      - name: Build installer (ARM64)
        shell: bash
        run: |
          node scripts/make-icons.mjs
          node scripts/fetch-miktex.mjs
          npx vite build
          npx electron-builder --win nsis --arm64 --publish never -c.nsis.artifactName='FreedomTex-Setup-${version}-arm64.exe'
          # The installer must contain MiKTeX; stop here if it does not.
          ls release/win-arm64-unpacked/resources/miktex/basic-miktex-*.exe

      # MiKTeX is x64 only; Windows 11 on ARM runs it through x64 emulation.
      - name: First run on a PC without LaTeX (installs the bundled MiKTeX)
        env:
          SMOKE_EXE: release\win-arm64-unpacked\FreedomTex.exe
        run: node scripts/test-firstrun.mjs

      - name: Compile templates with the fresh MiKTeX
        run: node scripts/test-templates.mjs blank example thesis ieee-conference

      - name: UI smoke test on the packaged app
        env:
          SMOKE_EXE: release\win-arm64-unpacked\FreedomTex.exe
        run: node scripts/smoke.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm-screenshots
          path: scripts/.smoke/**/*.png
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: freedomtex-windows-arm64
          path: release/FreedomTex-Setup-*-arm64.exe

      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" release/FreedomTex-Setup-*-arm64.exe --clobber
